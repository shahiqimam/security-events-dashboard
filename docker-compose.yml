services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_events}
      POSTGRES_USER: ${POSTGRES_USER:-security_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security_events} -d ${POSTGRES_DB:-security_events}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-security_events}
      DATABASE_USER: ${DATABASE_USER:-security_events}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-replace_with_long_random_value}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      INGEST_API_KEY: ${INGEST_API_KEY:-replace_with_random_ingest_key}
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SOURCE_STALE_MINUTES: ${SOURCE_STALE_MINUTES:-15}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
